# wordpress-vulnerable-lab — Phase D nginx vhost
# Author: Ayi NEDJIMI <ayinedjimi@users.noreply.github.com>
#
# INTENTIONAL BUGS (do NOT fix — these are training targets):
#   BUG #1: location / uses `alias /var/www/html/$uri` (slash-confused alias
#           → directory traversal because alias trims the location prefix).
#   BUG #2: `if (-f $uri)` evaluated BEFORE the PHP location block, so
#           requests for *.php~ / *.php.bak fall through and are served as
#           plain text by the static handler (PHP source disclosure).
#   BUG #3: server_tokens on → full nginx version disclosed in headers and
#           error pages.

server_tokens on;  # BUG #3

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # BUG #1 — slash-confused alias enables traversal:
    # GET /static../wp-config.php -> alias resolves to /var/www/html//wp-config.php
    location / {
        alias /var/www/html/$uri;
        try_files $uri $uri/ /index.php?$args;
    }

    # BUG #2 — wrong ordering: static check runs first, so
    # requests for backup PHP files (.php~ .php.bak .php.swp) are served
    # as text/plain by this block instead of being executed or denied.
    if (-f $request_filename) {
        # served as static — PHP source disclosure for *.php~ etc.
        break;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wp-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Loose ModSecurity-style include (see modsec.conf).
    include /etc/nginx/conf.d/modsec.conf;
}
