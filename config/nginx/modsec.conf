# wordpress-vulnerable-lab — Phase D "ModSecurity-style" loose ruleset
# Author: Ayi NEDJIMI <ayinedjimi@users.noreply.github.com>
#
# NOTE: stock nginx:1.18 image does NOT include libmodsecurity. This file
# simulates a CRS-lite WAF via plain nginx `if` checks against $args /
# $request_uri so the lab works out-of-the-box without a custom build.
# It deliberately catches ~80% of obvious payloads and lets blind /
# encoded variants through, giving scanners something to learn against.
#
# Caught (blocked with 403):
#   - <script>          plain XSS
#   - UNION SELECT      classic SQLi
#   - ../../etc/passwd  obvious LFI
#   - /bin/bash         RCE marker
#
# NOT caught (intentional gaps):
#   - URL-encoded payloads  (%3Cscript%3E, %2e%2e%2f...)
#   - Double-encoded        (%253Cscript%253E)
#   - Blind SQLi time-based (SLEEP, BENCHMARK)
#   - Case-mixed UNION      (UnIoN SeLeCt)  -> only exact upper match
#   - SSRF to internal IPs  (no egress filter)
#   - XXE / SSTI payloads
#   - Multipart body attacks (rules only inspect $args)

# Block plain <script>
if ($args ~* "<script") { return 403; }

# Block exact UNION SELECT (case sensitive uppercase only — gap)
if ($args ~ "UNION SELECT") { return 403; }

# Block obvious traversal (literal only — encoded variants pass)
if ($request_uri ~ "\.\./\.\./") { return 403; }

# Block /bin/bash marker
if ($args ~* "/bin/bash") { return 403; }

# Block <iframe
if ($args ~* "<iframe") { return 403; }

# (Intentionally absent: encoded-payload normalization, body inspection,
#  blind SQLi heuristics, SSRF egress controls, header rules, anomaly score.)
