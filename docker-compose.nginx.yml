################################################################################
# wordpress-vulnerable-lab — Phase D: Alternative nginx + PHP 8.1 + ModSecurity
# Author: Ayi NEDJIMI <ayinedjimi@users.noreply.github.com>
#
# Runs the same WordPress target behind nginx 1.18 (CVE-2021-23017 era) with
# a deliberately weak nginx vhost and a loose ModSecurity ruleset.
#
# Reuses the `db` service from docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# Then browse:  http://localhost:31888
#
# DO NOT EXPOSE TO THE INTERNET.
#
# Port allocations (host -> container):
#   nginx (alt WP) -> 31888 -> 80
################################################################################

services:

  wp-php:
    image: php:8.1-fpm-alpine
    container_name: wpvl-wp-php
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_USER: "wordpress"
      WORDPRESS_DB_PASSWORD: "wordpress"
      WORDPRESS_DB_NAME: "wordpress"
    # Shares the wp_data volume so the same WordPress filesystem is served.
    volumes:
      - wp_data:/var/www/html

  nginx:
    image: nginx:1.18
    container_name: wpvl-nginx
    restart: unless-stopped
    depends_on:
      - wp-php
    ports:
      - "31888:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/modsec.conf:/etc/nginx/conf.d/modsec.conf:ro
