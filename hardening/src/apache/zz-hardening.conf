# =============================================================================
# Hardening de Apache — wordpress-vulnerable-lab
# Se instala en /etc/apache2/conf-available/ y se habilita con a2enconf.
#
# Por qué aquí y no en .htaccess:
#   - WordPress y algunos plugins (p.ej. LiteSpeed Cache) reescriben .htaccess.
#   - La configuración del servidor no depende de AllowOverride.
#   - Ni la aplicación ni un usuario de WordPress pueden modificarla.
# =============================================================================

# -----------------------------------------------------------------------------
# M-01 — Exposición de archivos sensibles (hallazgo 2.3 del pentest)
# Segunda capa de defensa: la causa raíz se corrige quitando los archivos del
# webroot. Si alguien vuelve a dejar uno ahí, esta regla impide servirlo.
#
# Se responde 404 (no 403) para no confirmarle al atacante que el archivo existe.
# Se filtra por la URL solicitada, en cualquier carpeta del sitio, y sin
# distinguir mayúsculas y minúsculas.
# -----------------------------------------------------------------------------

# 1) Cualquier segmento de la ruta que empiece por punto:
#    .env, .git/, .svn/, .htaccess, .DS_Store, .env.backup ...
#    Excepción: /.well-known/ (validación ACME/Let's Encrypt, security.txt).
RedirectMatch 404 "(?i)/\.(?!well-known/)"

# 2) Respaldos, volcados de base de datos, logs y archivos temporales de editores.
RedirectMatch 404 "(?i)\.(bak|backup|old|orig|save|swp|swo|tmp|sql|gz|tgz|tar|zip|7z|rar|log|ini|conf|dist|env)$"
RedirectMatch 404 "~$"

# 3) Archivos que nunca deben solicitarse por HTTP.
#    wp-config.php lo incluye PHP desde el disco; no necesita servirse por la web.
RedirectMatch 404 "(?i)^/(wp-config\.php|info\.php|phpinfo\.php|adminer\.php|test\.php)$"

# -----------------------------------------------------------------------------
# M-02 — Listado de directorios (hallazgo 2.8 del pentest)
# La configuración base de Debian declara "Options Indexes FollowSymLinks" para
# /var/www/. Esta sección se combina con aquella y retira Indexes sin modificar
# el archivo apache2.conf de la distribución.
#
# Complemento: el Dockerfile deshabilita mod_autoindex. Sin ese módulo, ningún
# .htaccess puede volver a habilitar los listados, aunque declare +Indexes.
# -----------------------------------------------------------------------------
<Directory /var/www/>
    Options -Indexes
</Directory>
