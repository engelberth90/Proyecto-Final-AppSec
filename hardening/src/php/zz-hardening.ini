; Endurecimiento de PHP — M-08
; No revelar la versión de PHP en la cabecera X-Powered-By.
expose_php = Off

; No mostrar errores en las respuestas (los registros van a archivo).
display_errors = Off
log_errors = On

; M-08: los componentes actualizados (Elementor, WooCommerce, etc.) necesitan
; más memoria que el valor por defecto de 128M del núcleo.
memory_limit = 256M
